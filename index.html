<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Михаил — AI Фото за 2 часа</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a1f, #1a1a3d);
            color: white;
            min-height: 100vh;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        header {
            text-align: center;
            padding: 80px 20px 60px;
        }
        .hero-image {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #00f5ff;
            box-shadow: 0 0 60px rgba(0, 245, 255, 0.6);
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 20px 0;
            background: linear-gradient(90deg, #00f5ff, #ff00cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .highlight { color: #00f5ff; font-size: 1.6rem; }

        .cta {
            background: linear-gradient(45deg, #ff00cc, #00f5ff);
            color: white;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 30px 15px;
            box-shadow: 0 15px 35px rgba(0, 245, 255, 0.4);
            transition: 0.3s;
        }
        .cta:hover { transform: scale(1.08); }

        .form-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 30px;
            max-width: 600px;
            margin: 40px auto;
        }
        input, button {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
        }
        input { background: rgba(255,255,255,0.9); color: #111; }
        button { background: #00f5ff; color: #000; font-weight: bold; cursor: pointer; }

        footer { text-align: center; padding: 40px; opacity: 0.8; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <img src="https://via.placeholder.com/300x300/1a1a3d/00f5ff?text=МИХАИЛ" 
                 alt="Михаил" class="hero-image">
            
            <h1>Создавай крутые AI-фото</h1>
            <p class="highlight">Всего за <strong>2 часа</strong> на моём мастер-классе</p>
            
            <button class="cta" onclick="document.getElementById('form').scrollIntoView({behavior: 'smooth'})">
                Записаться на мастер-класс
            </button>
        </div>
    </header>

    <div class="container">
        <div class="form-section" id="form">
            <h2 style="text-align:center; margin-bottom:30px;">Запишитесь прямо сейчас</h2>
            <form action="https://formsubmit.co/твой@email.com" method="POST">
                <input type="text" name="name" placeholder="Ваше имя" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="tel" name="phone" placeholder="Телефон (необязательно)">
                <button type="submit" class="cta" style="width:100%; margin-top:20px;">Записаться</button>
            </form>
            <p style="text-align:center; margin-top:20px; font-size:0.95rem;">
                Мест мало • Ближайший поток — на этой неделе
            </p>
        </div>
    </div>

    <footer>
        Михаил • Эксперт по нейросетям<br>
        Личный агент Grok
    </footer>
</body>
</html>
